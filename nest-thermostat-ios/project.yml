# XcodeGen spec. Run `xcodegen` in this folder to produce NestThermostat.xcodeproj.
# (brew install xcodegen). Copy Secrets.xcconfig.example -> Secrets.xcconfig first.
name: NestThermostat
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  NestThermostat:
    type: application
    platform: iOS
    sources: [NestThermostat]
    info:
      path: NestThermostat/Info.plist
      properties:
        CFBundleDisplayName: Nest
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Read at runtime by AppConfig. Values come from Secrets.xcconfig.
        SDM_PROJECT_ID: $(SDM_PROJECT_ID)
        GOOGLE_CLIENT_ID: $(GOOGLE_CLIENT_ID)
        # Google's OAuth redirect lands on the reversed client id as a URL scheme.
        CFBundleURLTypes:
          - CFBundleURLName: google-oauth
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  NestThermostatTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NestThermostatTests]
    dependencies:
      - target: NestThermostat
